add_newline = false
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #7f1d1d)"
success_symbol = "[❯](bold #09090b)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #09090b"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "bold #27272a"

[git_branch]
format = "[$branch]($style) "
style = "italic #1e3a8a"

[git_status]
format     = '[$all_status]($style)'
style      = "#52525b"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
